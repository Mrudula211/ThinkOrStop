[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "think-or-stop"
version = "0.1.0"
description = "Think-or-Stop: design and evaluation of an adaptive early-exit CNN for efficient image classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: test requires a CUDA-capable GPU",
    "data: test requires a downloaded dataset in data/raw",
]
